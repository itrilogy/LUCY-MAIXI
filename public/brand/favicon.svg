<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="脉息 · MaiXi">
  <!--
    脉息 · MaiXi (PulseStream) 产品 favicon（鹿溪 CI）
    - 鹿溪绿底 #0D5E42：实验室品牌
    - 面部同心环：摄像头无感取脉
    - 脉冲波形 + 呼吸节律：BVP / 呼吸
    - 溪流 #00D2FF：脉息如溪
    - 源启星：微光察脉
  -->
  <defs>
    <linearGradient id="mx-bg" x1="3" y1="2" x2="29" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#127A55"/>
      <stop offset="100%" stop-color="#0D5E42"/>
    </linearGradient>
    <linearGradient id="mx-stream" x1="5" y1="24" x2="27" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#00D2FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7CF0FF" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#mx-bg)"/>
  <circle cx="9" cy="8" r="6.5" fill="#ffffff" opacity="0.06"/>

  <!-- facial sensing rings -->
  <ellipse cx="16" cy="14.2" rx="6.4" ry="7.2" fill="none" stroke="#F5F7FA" stroke-width="1.15" opacity="0.95"/>
  <ellipse cx="16" cy="14.2" rx="4.2" ry="4.8" fill="none" stroke="#F5F7FA" stroke-width="0.7" opacity="0.45"/>
  <circle cx="16" cy="14.2" r="1.15" fill="#F1C40F"/>

  <!-- BVP pulse -->
  <path d="M7.2 20.6 L10.2 20.6 L11.4 17.6 L13.1 23.2 L14.8 19.4 L16.2 20.6 L24.8 20.6"
        fill="none" stroke="#F5F7FA" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- breath rhythm -->
  <path d="M8 22.8 C11.2 21.6, 13.6 23.8, 16.2 22.6 C18.8 21.5, 21.2 23.2, 24.2 22.4"
        fill="none" stroke="#00D2FF" stroke-width="0.9" stroke-linecap="round" opacity="0.85"/>

  <path d="M5.5 26.2 C9 24.8, 12.5 27.1, 16 25.9 C19.2 24.8, 22.5 25.6, 26.5 24.9"
        fill="none" stroke="url(#mx-stream)" stroke-width="1.45" stroke-linecap="round"/>

  <g transform="translate(24.2 7.2)">
    <path d="M0-2.1 L0.45-0.45 L2.1 0 L0.45 0.45 L0 2.1 L-0.45 0.45 L-2.1 0 L-0.45-0.45 Z" fill="#00D2FF"/>
    <circle cx="0" cy="0" r="0.45" fill="#F5F7FA"/>
  </g>
</svg>
